<!DOCTYPE html>
<html>
<head>
    <title>Current Date</title>
</head>
<body>

<script>
    let date = new Date();

    let day = date.getDate();
    let month = date.getMonth() + 1;
    let year = date.getFullYear();

    document.write("Current Date: " + month + "-" + day + "-" + year);
</script>

</body>
</html>
