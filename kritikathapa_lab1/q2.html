<!DOCTYPE html>
<html>
<head>
    <title>Alphabetical Order</title>
</head>
<body>

<script>
    function sortString(str) {
    return str.split('').sort().join('');
    }

    let str = "baka";
    document.write("Original String: " + str + "<br>");
    document.write("Alphabetical Order: " + sortString(str));
</script>

</body>
</html>
